name: Build NEXUS ARCADE APK

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'addons/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'icon.svg'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK is pre-installed on ubuntu-latest runners
      - name: Install Android packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0"
          yes | $SDKMANAGER --licenses > /dev/null

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p /tmp/godot-tpl
          unzip -q -o Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-tpl
          cp -r /tmp/godot-tpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Install Android build template
        run: |
          unzip -q -o ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip
          ls android/build/build.gradle

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --export-debug "NEXUS ARCADE (Quest 3)" builds/NexusArcade.apk
          ls -lh builds/NexusArcade.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusArcade-APK
          path: builds/NexusArcade.apk
          if-no-files-found: error
